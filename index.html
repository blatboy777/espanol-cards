<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>Карточки по испанскому</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Один экран: счётчик, карточка, кнопки. Тёплая бумага + красная пометка учителя. */
:root{--bg:#f6f3ee;--card:#ffffff;--ink:#231d1a;--mut:#756b63;--acc:#b8372b;--ok:#2d7f55;--bad:#b8372b;--line:#e3dbd1;--ink-on:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171311;--card:#221d1a;--ink:#f1eae3;--mut:#a3978c;--acc:#ee7a68;--ok:#5cc28e;--bad:#ee7a68;--line:#3a332e;--ink-on:#171311;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171311;--card:#221d1a;--ink:#f1eae3;--mut:#a3978c;--acc:#ee7a68;--ok:#5cc28e;--bad:#ee7a68;--line:#3a332e;--ink-on:#171311;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.stats{color:var(--mut);font-size:14px;margin-bottom:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.modes button{flex:1;min-width:100px}
button{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--ink-on)}
button.ok{background:var(--ok);border-color:var(--ok);color:var(--ink-on)}
button.bad{background:var(--bad);border-color:var(--bad);color:var(--ink-on)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 18px;min-height:200px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:10px}
.q{font-size:30px;font-weight:600;overflow-wrap:anywhere}
.a{font-size:24px;color:var(--acc);min-height:32px;overflow-wrap:anywhere}
.hint{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;margin-top:14px}.row button{flex:1}
input{font:inherit;font-size:22px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.fb{font-size:18px;min-height:26px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.foot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.foot button{font-size:13px;padding:6px 10px;white-space:nowrap}
</style>
</head>
<body>
<main>
<h1>Карточки по испанскому</h1>
<div class="stats" id="stats"></div>
<div class="bar"><i id="bar"></i></div>
<div class="modes">
  <button id="m-cards" class="on">Карточки</button>
  <button id="m-type">Печатать</button>
  <button id="dir">RU → ES</button>
</div>
<div class="card" id="card"></div>
<div class="row" id="btns"></div>
<div class="foot">
  <span>Ударения и ñ можно не ставить</span>
  <button id="reset">Сбросить прогресс</button>
</div>
</main>
<script>
// [испанский, русский]. Новые слова добавляются в конец; прогресс хранится по испанскому слову.
const WORDS=[
["trabajar","работать"],["estudiar","учить, изучать"],["hablar","говорить"],["escuchar","слушать"],["necesitar","нуждаться, нужно"],
["comer","есть, кушать"],["beber","пить"],["leer","читать"],["vivir","жить"],["escribir","писать"],
["el libro","книга"],["el agua","вода (ж. р., но el!)"],["el español","испанский язык"],["la mesa","стол"],["la casa","дом"],
["la ciudad","город"],["el profesor","преподаватель"],["la clase","класс; занятие"],["el estudiante","студент"],["la lección","урок (в учебнике)"],
["el día","день"],["el lápiz","карандаш"],["la escuela","школа"],["la hermana","сестра"],["el hermano","брат"],
["ser","быть (кто? какой?)"],["estar","быть (где? как себя чувствует)"],["tener","иметь"],["querer","хотеть; любить"],["hay","есть, имеется"],
["grande","большой"],["nuevo","новый"],["interesante","интересный"],["difícil","трудный"],["fácil","лёгкий"],
["veinte","20"],["treinta","30"],["cuarenta","40"],["cincuenta","50"],["sesenta","60"],
["ir","идти, ехать"],["venir","приходить"],["poner","класть, ставить"],["salir","выходить"],["poder","мочь"],
["contento","довольный"],["ocupado","занятый"],["sentado","сидящий"],["bien","хорошо"],["simpático","симпатичный"],
["culto","образованный"],["el periodista","журналист"],["el ingeniero","инженер"],["ruso","русский"],["cubano","кубинский"],
["el teatro","театр"],["la universidad","университет"],["hoy","сегодня"],["a pie","пешком"],["en casa","дома"]
];
const KEY="es-cards-v1",INT=[1,2,4,8,16,30],NEW_PER_SESSION=10;
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const day=(n=0)=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString("sv")};
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[¿?¡!.,]/g,"").trim();
const $=id=>document.getElementById(id);
let mode="cards",dir="ru-es",queue=[],cur=null,revealed=false,extraNew=0,resetArmed=false;

function build(){
  const t=day();
  const due=WORDS.filter(w=>S[w[0]]&&S[w[0]].due<=t).sort(()=>Math.random()-.5);
  const fresh=WORDS.filter(w=>!S[w[0]]).slice(0,NEW_PER_SESSION+extraNew);
  queue=due.concat(fresh);
}
function stats(){
  const t=day(),n=WORDS.length;
  const due=WORDS.filter(w=>S[w[0]]&&S[w[0]].due<=t).length;
  const fresh=WORDS.filter(w=>!S[w[0]]).length;
  const done=WORDS.filter(w=>S[w[0]]&&S[w[0]].box>=4).length;
  $("stats").textContent=`К повторению: ${due} · новых: ${fresh} · выучено: ${done} из ${n} · в очереди: ${queue.length}`;
  $("bar").style.width=(100*done/n)+"%";
}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="es-ES";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function grade(ok){
  const k=cur[0],s=S[k]||{box:0};
  if(ok){s.box=Math.min(5,s.box+1);s.due=day(INT[s.box])}
  else{s.box=0;s.due=day(0);queue.push(cur)}
  S[k]=s;save();next();
}
function next(){
  stats();revealed=false;cur=queue.shift();
  const card=$("card"),btns=$("btns");
  if(!cur){
    card.innerHTML=`<div class="q">На сегодня всё</div><div class="hint">Возвращайтесь завтра: вспомненные слова вернутся по расписанию.</div>`;
    btns.innerHTML=`<button class="primary" id="more">Ещё 10 новых слов</button>`;
    $("more").onclick=()=>{extraNew+=10;build();next()};
    return;
  }
  const front=dir==="ru-es"?cur[1]:cur[0];
  if(mode==="cards"){
    card.innerHTML=`<div class="q">${front}</div><div class="a" id="ans"></div><div class="hint" id="h">Вспомните, потом нажмите «Показать»</div>`;
    btns.innerHTML=`<button class="primary" id="show">Показать</button>`;
    $("show").onclick=reveal;
    if(dir==="es-ru")speak(cur[0]);
  }else{
    card.innerHTML=`<div class="q">${cur[1]}</div><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="по-испански"><div class="fb" id="fb"></div>`;
    btns.innerHTML=`<button class="primary" id="chk">Проверить</button>`;
    const inp=$("inp");inp.focus();
    const chk=()=>{
      if(revealed)return;revealed=true;
      const v=norm(inp.value),full=norm(cur[0]),bare=full.replace(/^(el|la|los|las)\s+/,"");
      const ok=v===full||v===bare,fb=$("fb");
      fb.className="fb "+(ok?"ok":"bad");
      fb.textContent=(ok?"Верно: ":"Правильно: ")+cur[0];
      speak(cur[0]);
      btns.innerHTML=`<button class="${ok?"ok":"primary"}" id="go">Дальше</button>`;
      $("go").onclick=()=>grade(ok);$("go").focus();
    };
    $("chk").onclick=chk;
    inp.onkeydown=e=>{if(e.key==="Enter")chk()};
  }
}
function reveal(){
  revealed=true;
  $("ans").textContent=dir==="ru-es"?cur[0]:cur[1];$("h").textContent="";
  if(dir==="ru-es")speak(cur[0]);
  $("btns").innerHTML=`<button class="bad" id="no">Не помню</button><button class="ok" id="yes">Помню</button>`;
  $("no").onclick=()=>grade(false);$("yes").onclick=()=>grade(true);
}
function setMode(m){mode=m;$("m-cards").className=m==="cards"?"on":"";$("m-type").className=m==="type"?"on":"";$("dir").hidden=m!=="cards";build();next()}
$("m-cards").onclick=()=>setMode("cards");
$("m-type").onclick=()=>{dir="ru-es";$("dir").textContent="RU → ES";setMode("type")};
$("dir").onclick=()=>{dir=dir==="ru-es"?"es-ru":"ru-es";$("dir").textContent=dir==="ru-es"?"RU → ES":"ES → RU";build();next()};
$("reset").onclick=()=>{
  if(!resetArmed){resetArmed=true;$("reset").textContent="Нажмите ещё раз";setTimeout(()=>{resetArmed=false;$("reset").textContent="Сбросить прогресс"},3000);return}
  resetArmed=false;$("reset").textContent="Сбросить прогресс";S={};save();extraNew=0;build();next();
};
build();next();
</script>
</body>
</html>
