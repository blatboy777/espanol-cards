<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>Тренажёр глаголов</title>
<style>
:root{--bg:#f6f3ee;--card:#ffffff;--ink:#231d1a;--mut:#756b63;--acc:#b8372b;--ok:#2d7f55;--bad:#b8372b;--line:#e3dbd1;--ink-on:#ffffff;--okbg:#e5f3ea;--badbg:#f9e6e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171311;--card:#221d1a;--ink:#f1eae3;--mut:#a3978c;--acc:#ee7a68;--ok:#5cc28e;--bad:#ee7a68;--line:#3a332e;--ink-on:#171311;--okbg:#1d3326;--badbg:#3a211d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-block:18px 50px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto}
h1{font-size:21px;margin:0 0 4px}
a{color:var(--acc)}
.stats{color:var(--mut);font-size:14px;margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips button{padding:7px 12px;font-size:14px}
button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--ink-on)}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.verb{font-size:28px;font-weight:700}
.ru{color:var(--mut);margin-bottom:12px}
.tag{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.rowf{display:grid;grid-template-columns:130px 1fr 24px;gap:8px;align-items:center;margin:6px 0}
.rowf label{color:var(--mut);font-size:14px}
input{font:inherit;font-size:19px;width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input.right{border-color:var(--ok);background:var(--okbg)}
input.wrong{border-color:var(--bad);background:var(--badbg)}
.fix{grid-column:2/4;color:var(--bad);font-size:15px;margin-top:-2px}
.row{display:flex;gap:10px;margin-top:14px}.row button{flex:1}
.tbl{width:100%;border-collapse:collapse;margin:8px 0}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line)}.tbl td:first-child{color:var(--mut);font-size:14px;width:46%}.tbl td:last-child{font-weight:600;font-size:19px}
.lock{opacity:.5}
.big{font-size:30px;font-weight:700;text-align:center;margin:10px 0 2px}
.fb{min-height:26px;text-align:center;font-size:18px;margin-top:8px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.foot{margin-top:20px;display:flex;justify-content:space-between;gap:10px;color:var(--mut);font-size:13px}
.foot button{font-size:13px;padding:6px 10px}
</style>
</head>
<body>
<main>
<h1>Тренажёр глаголов</h1>
<div class="stats" id="stats"></div>
<div class="bar"><i id="bar"></i></div>
<div class="chips" id="tenses"></div>
<div class="chips"><button id="m-table" class="on">Таблица</button><button id="m-cards">Карточки форм</button><button id="m-blitz">Блиц: одна форма</button><button id="f-all" class="on">Все</button><button id="f-reg">Правильные</button><button id="f-irr">Неправильные</button></div>
<div class="card" id="card"></div>
<div class="foot"><span>Ударения можно не ставить. <a href="index.html">Карточки</a> · <a href="urok4.html">Урок 4</a></span><button id="reset">Сбросить</button></div>
</main>
<script>
const P=["yo","tú","él / ella / usted","nosotros","vosotros","ellos / ellas / ustedes"];
const END={ar:["o","as","a","amos","áis","an"],er:["o","es","e","emos","éis","en"],ir:["o","es","e","imos","ís","en"]};
const reg=inf=>END[inf.slice(-2)].map(e=>inf.slice(0,-2)+e);
// [инфинитив, перевод]; нестандартные формы в IRR, остальные строятся по окончаниям
const V=[["trabajar","работать"],["estudiar","учить, изучать"],["hablar","говорить"],["escuchar","слушать"],["necesitar","нуждаться"],
["comer","есть"],["beber","пить"],["leer","читать"],["vivir","жить"],["escribir","писать"],
["ser","быть (кто, какой)"],["estar","быть, находиться"],["ir","идти, ехать"],["venir","приходить"],["poder","мочь"],["poner","класть"],
["querer","хотеть; любить"],["salir","выходить"],["pensar","думать"],["empezar","начинать"],["contar","рассказывать"],["volver","возвращаться"],
["tener","иметь"],["decir","говорить, сказать"],["hacer","делать"],["ver","видеть"]];
const IRR={
ser:["soy","eres","es","somos","sois","son"],estar:["estoy","estás","está","estamos","estáis","están"],
ir:["voy","vas","va","vamos","vais","van"],venir:["vengo","vienes","viene","venimos","venís","vienen"],
poder:["puedo","puedes","puede","podemos","podéis","pueden"],poner:["pongo","pones","pone","ponemos","ponéis","ponen"],
querer:["quiero","quieres","quiere","queremos","queréis","quieren"],salir:["salgo","sales","sale","salimos","salís","salen"],
pensar:["pienso","piensas","piensa","pensamos","pensáis","piensan"],empezar:["empiezo","empiezas","empieza","empezamos","empezáis","empiezan"],
contar:["cuento","cuentas","cuenta","contamos","contáis","cuentan"],volver:["vuelvo","vuelves","vuelve","volvemos","volvéis","vuelven"],
tener:["tengo","tienes","tiene","tenemos","tenéis","tienen"],decir:["digo","dices","dice","decimos","decís","dicen"],
hacer:["hago","haces","hace","hacemos","hacéis","hacen"],ver:["veo","ves","ve","vemos","veis","ven"]};
// открываются по мере прохождения: добавляю формы времени и ставлю open:true
const TENSES=[{id:"presente",name:"Presente",open:true},{id:"perfecto",name:"Perfecto compuesto · урок 5",open:false},{id:"futuro",name:"Futuro · урок 7",open:false},{id:"indefinido",name:"Indefinido · уроки 8–9",open:false},{id:"imperfecto",name:"Imperfecto · урок 10",open:false},{id:"condicional",name:"Condicional · урок 12",open:false},{id:"pluscuamperfecto",name:"Pluscuamperfecto · урок 13",open:false}];
const UNITS=[].concat(...TENSES.filter(t=>t.open).map(t=>V.map(([inf,ru])=>({id:inf+"|"+t.id,inf,ru,tense:t,irr:!!IRR[inf],forms:IRR[inf]||reg(inf)}))));
const KEY="es-verbs-v1",INT=[1,2,4,8,16,30],NEW=5;
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const day=(n=0)=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString("sv")};
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/\s+/g," ");
const $=id=>document.getElementById(id);
let tense="presente",mode="table",filt="all",queue=[],cur=null,extra=0,miss=[],streak=0,resetArmed=false;
const pool=()=>UNITS.filter(u=>u.tense.id===tense&&(filt==="all"||(filt==="irr")===u.irr));
function build(){
  const t=day(),p=pool();
  const due=p.filter(u=>S[u.id]&&S[u.id].due<=t).sort(()=>Math.random()-.5);
  const fresh=p.filter(u=>!S[u.id]).slice(0,NEW+extra);
  queue=due.concat(fresh);
}
function stats(){
  const t=day(),p=pool();
  if(mode==="cards"){const all=cardPool(),due=all.filter(c=>S[c.id]&&S[c.id].due<=t).length,fresh=all.filter(c=>!S[c.id]).length,done=all.filter(c=>S[c.id]&&S[c.id].box>=4).length;
    $("stats").textContent=`Карточки форм. К повторению: ${due} · новых: ${fresh} · выучено: ${done} из ${all.length} · в очереди: ${queue.length}`;$("bar").style.width=(100*done/Math.max(1,all.length))+"%";return}
  const due=p.filter(u=>S[u.id]&&S[u.id].due<=t).length,fresh=p.filter(u=>!S[u.id]).length,done=p.filter(u=>S[u.id]&&S[u.id].box>=4).length;
  $("stats").textContent=mode==="table"?`К повторению: ${due} · новых: ${fresh} · выучено: ${done} из ${p.length} · в очереди: ${queue.length}`:`Блиц: подряд верных ${streak} · ошибок в этой серии: ${miss.length}`;
  $("bar").style.width=(100*done/Math.max(1,p.length))+"%";
}
function chips(){
  $("tenses").innerHTML=TENSES.map(t=>`<button data-t="${t.id}" class="${t.id===tense?"on":""} ${t.open?"":"lock"}" ${t.open?"":"disabled"}>${t.name}</button>`).join("");
  $("tenses").querySelectorAll("button:not(:disabled)").forEach(b=>b.onclick=()=>{tense=b.dataset.t;chips();restart()});
  $("m-table").className=mode==="table"?"on":"";$("m-blitz").className=mode==="blitz"?"on":"";$("m-cards").className=mode==="cards"?"on":"";
  $("f-all").className=filt==="all"?"on":"";$("f-reg").className=filt==="reg"?"on":"";$("f-irr").className=filt==="irr"?"on":"";
}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="es-ES";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function restart(){extra=0;miss=[];streak=0;if(mode==="cards"){buildCards();nextCard();return}build();mode==="table"?nextTable():nextBlitz()}

function nextTable(){
  stats();cur=queue.shift();const card=$("card");
  if(!cur){card.innerHTML=`<div class="verb">На сегодня всё</div><div class="ru">Слабые глаголы вернутся завтра и позже по расписанию.</div><div class="row"><button class="primary" id="more">Ещё 5 новых глаголов</button></div>`;$("more").onclick=()=>{extra+=NEW;build();nextTable()};return}
  const head=`<div class="tag">${cur.tense.name} · ${cur.irr?"неправильный":"правильный"}</div><div class="verb">${cur.inf}</div><div class="ru">${cur.ru}</div>`;
  if(!S[cur.id]){
    card.innerHTML=head+`<div class="tag">Новый глагол: изучите форму, потом проверьте себя</div><table class="tbl">${cur.forms.map((f,i)=>`<tr><td>${P[i]}</td><td>${f}</td></tr>`).join("")}</table><div class="row"><button class="primary" id="go">Закрыть и проверить себя</button></div>`;
    speak(cur.inf);$("go").onclick=()=>{S[cur.id]={box:0,due:day(0),seen:1};save();queueMicrotask(()=>{queue.unshift(cur);nextTable()})};return;
  }
  card.innerHTML=head+P.map((p,i)=>`<div class="rowf"><label for="i${i}">${p}</label><input id="i${i}" autocomplete="off" autocapitalize="off" spellcheck="false"><span id="m${i}"></span></div>`).join("")+`<div class="row"><button class="primary" id="chk">Проверить</button></div>`;
  const ins=[...card.querySelectorAll("input")];ins[0].focus();
  ins.forEach((el,i)=>el.onkeydown=e=>{if(e.key==="Enter"){i<5?ins[i+1].focus():check()}});
  $("chk").onclick=check;let checked=false;
  function check(){
    if(checked)return;checked=true;let all=true;
    ins.forEach((el,i)=>{const ok=norm(el.value)===norm(cur.forms[i]);if(!ok)all=false;el.className=ok?"right":"wrong";el.readOnly=true;$("m"+i).textContent=ok?"✓":"✗";
      if(!ok){const r=el.closest(".rowf"),f=document.createElement("div");f.className="fix";f.textContent="Правильно: "+cur.forms[i];r.after(f)}});
    const s=S[cur.id];
    if(all){s.box=Math.min(5,s.box+1);s.due=day(INT[s.box])}else{s.box=0;s.due=day(0);queue.push(cur)}
    save();stats();speak(cur.forms.join(", "));
    $("card").querySelector(".row").innerHTML=`<button class="${all?"ok":"primary"}" id="nx">${all?"Всё верно. Дальше":"Дальше"}</button>`;
    $("nx").onclick=nextTable;$("nx").focus();
  }
}

// Карточки форм: по одной форме неправильных глаголов, с правилом на обороте
const RULE={ser:"полностью особый глагол: учить наизусть",estar:"правильные окончания, но ударение: estás, está, están; yo — estoy",ir:"полностью особый глагол: учить наизусть",
venir:"yo — vengo; в остальных e→ie, кроме nosotros и vosotros",tener:"yo — tengo; в остальных e→ie, кроме nosotros и vosotros",decir:"yo — digo; в остальных e→i, кроме nosotros и vosotros",
poner:"особая только форма yo: pongo",salir:"особая только форма yo: salgo",hacer:"особая только форма yo: hago",ver:"yo — veo, остальные формы короткие",
poder:"o→ue, кроме nosotros и vosotros",volver:"o→ue, кроме nosotros и vosotros",contar:"o→ue, кроме nosotros и vosotros",
querer:"e→ie, кроме nosotros и vosotros",pensar:"e→ie, кроме nosotros и vosotros",empezar:"e→ie, кроме nosotros и vosotros"};
const cardPool=()=>[].concat(...UNITS.filter(u=>u.tense.id===tense&&u.irr).map(u=>P.map((p,i)=>({id:"c|"+u.id+"|"+i,u,i}))));
function buildCards(){
  const t=day(),all=cardPool();
  const due=all.filter(c=>S[c.id]&&S[c.id].due<=t).sort(()=>Math.random()-.5);
  const fresh=all.filter(c=>!S[c.id]).sort(()=>Math.random()-.5).slice(0,12+extra);
  queue=due.concat(fresh);
}
function nextCard(){
  stats();cur=queue.shift();const card=$("card");
  if(!cur){card.innerHTML=`<div class="verb">На сегодня всё</div><div class="ru">Формы, которые вы вспомнили, вернутся через 1, 2, 4, 8 дней и позже.</div><div class="row"><button class="primary" id="more">Ещё 12 новых форм</button></div>`;$("more").onclick=()=>{extra+=12;buildCards();nextCard()};return}
  const {u,i}=cur;
  card.innerHTML=`<div class="tag">${u.tense.name} · неправильный глагол</div><div class="verb">${u.inf} <span style="color:var(--acc)">· ${P[i]}</span></div><div class="ru">${u.ru}</div><div class="big" id="ans" style="min-height:42px"></div><div class="ru" id="rl" style="text-align:center"></div><div class="row"><button class="primary" id="show">Показать</button></div>`;
  $("show").onclick=()=>{
    $("ans").textContent=u.forms[i];$("rl").textContent=RULE[u.inf]||"";speak(u.forms[i]);
    $("card").querySelector(".row").innerHTML=`<button id="no" style="background:var(--bad);border-color:var(--bad);color:var(--ink-on)">Не помню</button><button id="yes" style="background:var(--ok);border-color:var(--ok);color:var(--ink-on)">Помню</button>`;
    const grade=ok=>{const s=S[cur.id]||{box:0};if(ok){s.box=Math.min(5,s.box+1);s.due=day(INT[s.box])}else{s.box=0;s.due=day(0);queue.push(cur)}S[cur.id]=s;save();nextCard()};
    $("no").onclick=()=>grade(false);$("yes").onclick=()=>grade(true);
  };
}
function nextBlitz(){
  stats();const p=pool();let u,i;
  if(miss.length&&Math.random()<.4){[u,i]=miss[Math.floor(Math.random()*miss.length)]}else{u=p[Math.floor(Math.random()*p.length)];i=Math.floor(Math.random()*6)}
  cur=[u,i];const card=$("card");
  card.innerHTML=`<div class="tag">${u.tense.name}</div><div class="big">${u.inf}</div><div class="ru" style="text-align:center">${u.ru}</div><div class="big" style="font-size:22px;color:var(--acc)">${P[i]}</div><input id="bi" autocomplete="off" autocapitalize="off" spellcheck="false" style="text-align:center;margin-top:10px"><div class="fb" id="fb"></div><div class="row"><button class="primary" id="chk">Проверить</button></div>`;
  const inp=$("bi");inp.focus();let done=false;
  const chk=()=>{
    if(done){nextBlitz();return}done=true;
    const ok=norm(inp.value)===norm(u.forms[i]),fb=$("fb");
    fb.className="fb "+(ok?"ok":"bad");fb.textContent=ok?"Верно: "+u.forms[i]:"Правильно: "+u.forms[i];
    if(ok){streak++;const k=miss.findIndex(m=>m[0]===u&&m[1]===i);if(k>=0)miss.splice(k,1)}else{streak=0;if(!miss.some(m=>m[0]===u&&m[1]===i))miss.push([u,i])}
    stats();speak(u.forms[i]);$("chk").textContent="Дальше";
  };
  $("chk").onclick=chk;inp.onkeydown=e=>{if(e.key==="Enter")chk()};
}
$("m-table").onclick=()=>{mode="table";chips();restart()};
$("m-cards").onclick=()=>{mode="cards";chips();restart()};
$("m-blitz").onclick=()=>{mode="blitz";chips();restart()};
$("f-all").onclick=()=>{filt="all";chips();restart()};
$("f-reg").onclick=()=>{filt="reg";chips();restart()};
$("f-irr").onclick=()=>{filt="irr";chips();restart()};
$("reset").onclick=()=>{
  if(!resetArmed){resetArmed=true;$("reset").textContent="Нажмите ещё раз";setTimeout(()=>{resetArmed=false;$("reset").textContent="Сбросить"},3000);return}
  resetArmed=false;$("reset").textContent="Сбросить";S={};save();restart();
};
chips();restart();
</script>
</body>
</html>
